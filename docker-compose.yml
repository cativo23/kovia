services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/kovia
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kovia
      REDIS_URL: redis://redis:6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_ACCESS_SECRET: dev-access-secret-kovia-2026
      JWT_REFRESH_SECRET: dev-refresh-secret-kovia-2026
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      APP_URL: http://localhost:3001
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: kovia-animals
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9000/kovia-animals
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      N8N_WEBHOOK_URL: ""
      CI: "true"          # makes prisma migrate deploy non-interactive in no-TTY
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/src/generated/prisma   # preserve image-baked Prisma client across bind mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NUXT_API_INTERNAL: http://api:3000
      NUXT_PUBLIC_SCORING_DISPLAY_ENABLED: 'true'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kovia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/kovia-animals --ignore-existing;
      mc anonymous set download myminio/kovia-animals;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
  miniodata:
